name: Run Microsoft Teams Message Collector Cronjob

on:
  # Tắt lịch chạy tự động 10 phút/lần để tránh bị Microsoft khóa tài khoản (Rate Limit "Try again later")
  # Job này sẽ được kích hoạt an toàn qua Webhook cron-job.org hoặc workflow_dispatch
  # schedule:
  #   - cron: '*/10 * * * *'

  # Cho phép kích hoạt chạy thủ công qua nút "Run workflow" trên giao diện GitHub
  workflow_dispatch:

env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  run-teams-collector:
    runs-on: ubuntu-latest

    steps:
      # 0. Kiểm tra và ghi nhận giờ CI được gọi theo múi giờ Hồ Chí Minh (UTC+7)
      - name: Check CI call time (Asia/Ho_Chi_Minh)
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh || true
          TRIGGER_HCM=$(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S')
          TRIGGER_UTC=$(TZ=UTC date '+%Y-%m-%d %H:%M:%S')
          HOUR_HCM=$(TZ=Asia/Ho_Chi_Minh date '+%-H')
          echo "CI_TRIGGER_TIME=${TRIGGER_HCM}" >> $GITHUB_ENV
          echo "========================================================"
          echo "⏰ KIỂM TRA GIỜ CI ĐƯỢC GỌI (Asia/Ho_Chi_Minh - UTC+7)"
          echo " - Event kích hoạt : ${{ github.event_name }}"
          echo " - Giờ UTC         : ${TRIGGER_UTC} UTC"
          echo " - Giờ Hồ Chí Minh : ${TRIGGER_HCM} (+07)"
          if [ "$HOUR_HCM" -lt 8 ]; then
            SHIFT="Ca 02:00 AM (Lấy từ 18:00 hôm qua -> 02:00 sáng nay)"
          elif [ "$HOUR_HCM" -lt 16 ]; then
            SHIFT="Ca 01:00 PM / 13:00 (Lấy từ 02:00 sáng nay -> 13:00 chiều nay)"
          else
            SHIFT="Ca 06:00 PM / 18:00 (Lấy từ 13:00 chiều nay -> 18:00 tối nay)"
          fi
          echo " - Ca nhận diện    : ${SHIFT}"
          echo "========================================================"
          {
            echo "### ⏰ Thông tin giờ gọi CI (Asia/Ho_Chi_Minh)"
            echo "- **Sự kiện kích hoạt:** \`${{ github.event_name }}\`"
            echo "- **Giờ Hồ Chí Minh (UTC+7):** \`${TRIGGER_HCM}\`"
            echo "- **Giờ chuẩn UTC:** \`${TRIGGER_UTC}\`"
            echo "- **Ca chạy:** ${SHIFT}"
          } >> $GITHUB_STEP_SUMMARY

      # 1. Tải toàn bộ mã nguồn trong Repository về máy ảo Ubuntu
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cài đặt Trình duyệt Google Chrome chính thức trên máy ảo Ubuntu
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      # 4. Cài đặt các thư viện Python từ requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install undetected-chromedriver selenium gspread gspread-formatting google-auth python-dotenv pytz; fi

      # 5. Thực thi script Python chính
      - name: Execute Python script
        env:
          TZ: Asia/Ho_Chi_Minh
          CI_TRIGGER_TIME: ${{ env.CI_TRIGGER_TIME }}
          TEAMS_EMAIL: ${{ secrets.TEAMS_EMAIL }}
          TEAMS_PASSWORD: ${{ secrets.TEAMS_PASSWORD }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS_JSON }}
          GCP_SA_KEY: ${{ secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS_JSON }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          # Chờ ngẫu nhiên 5-25s để tránh nghẽn tải đúng đầu giờ tại Microsoft / Azure
          sleep $((RANDOM % 20 + 5))
          python get_message.py

      # 6. (Tùy chọn) Lưu ảnh màn hình (screenshot) nếu xảy ra lỗi để kiểm tra/debug
      - name: Upload error screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: '*.png'
          retention-days: 7
